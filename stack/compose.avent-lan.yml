# Fake baby monitors on the Tuya LAN protocol (lan_monitor.py), next to the lab's Home Assistant, so
# the Avent integration's LAN client has something to connect to without a real camera. Opt-in:
# stack.sh adds this file with LAB_AVENT_LAN=on (and the Avent add-on on).
#
# - lan-34 speaks 3.4 and is the simulated monitor the cloud fake already reports
#   (labavent000000000001); lan-33 speaks 3.3 and is a second device (labavent000000000002, "Lab
#   second monitor"), which the cloud fake adds. The integration finds a new device only in its
#   config flow, so the second one appears in a fresh data folder (or after removing the entry).
# - Their made-up local keys are generated by stack.sh into $LAB_HA_DATA/lan/monitors.json (mode
#   600, never printed); fake_tuya.py hands them to the integration as the devices' localKey.
# - Discovery broadcasts go to the lab network's broadcast address (UDP 6667, 172.31.240.255). This
#   machine's own interface on that bridge sees them too, never its LAN: they are not forwarded,
#   and nothing here binds a port on the host.

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  restart: "no"
  cpu_shares: 256

services:
  fake-tuya:
    environment:
      - FAKE_TUYA_LAN_MONITORS=/lan/monitors.json
    volumes:
      - ${LAB_HA_DATA}/lan/monitors.json:/lan/monitors.json:ro

  lan-34:
    <<: *hardened
    image: ha-companion-lab-ha:2026.11.0
    container_name: lab-lan-34
    entrypoint: ["python3", "-I", "/app/lan_monitor.py"]
    read_only: true
    cpus: 0.25
    mem_limit: 128m
    environment:
      - LAN_MONITOR_ID=labavent000000000001
      - LAN_MONITOR_VERSION=${AVENT_LAB_LAN_34_VERSION:-3.4}
      - LAN_MONITOR_DISCOVERY=${AVENT_LAB_LAN_DISCOVERY:-on}
    volumes:
      - ./lan_monitor.py:/app/lan_monitor.py:ro
      - ${LAB_HA_DATA}/lan/monitors.json:/lan/monitors.json:ro
    networks:
      lab:
        ipv4_address: 172.31.240.30

  lan-33:
    <<: *hardened
    image: ha-companion-lab-ha:2026.11.0
    container_name: lab-lan-33
    entrypoint: ["python3", "-I", "/app/lan_monitor.py"]
    read_only: true
    cpus: 0.25
    mem_limit: 128m
    environment:
      - LAN_MONITOR_ID=labavent000000000002
      - LAN_MONITOR_VERSION=${AVENT_LAB_LAN_33_VERSION:-3.3}
      - LAN_MONITOR_DISCOVERY=${AVENT_LAB_LAN_DISCOVERY:-on}
      # How it answers a status query (lan_monitor.py: unvalid, as measured on an SCD923, state or silent).
      - LAN_MONITOR_QUERY33=${AVENT_LAB_LAN_33_QUERY:-unvalid}
    volumes:
      - ./lan_monitor.py:/app/lan_monitor.py:ro
      - ${LAB_HA_DATA}/lan/monitors.json:/lan/monitors.json:ro
    networks:
      lab:
        ipv4_address: 172.31.240.31
