# A synthetic test camera: RTSP test pictures with sound, with no camera behind them, so tests of a
# camera card, go2rtc or a camera bridge never need a real (or someone's private) camera.
#
#   docker compose up -d       # start (teststream/compose.yml)
#   docker compose stop        # stop
#
# Reachable as rtsp://<host>:18554/<path> (TESTSTREAM_PORT; 8554 inside the container). Each path starts its ffmpeg only while someone reads it
# (runOnDemand) and stops 10 s after the last reader, so an idle server costs nothing.
#
# sliced-threads=0: one slice per frame. -tune zerolatency alone splits each frame into slices;
# a forwarder that inserts SPS/PPS before every IDR-slice packet (the Avent bridge does) then puts
# them between slices of one picture, and the app shows a smeared picture (measured 10-11-2026).
#
# Paths:
#   pattern        1280x720 15 fps H.264 + AAC 16 kHz mono: a moving test picture (with a running
#                  clock and frame counter top left) and a beeping 440 Hz tone, like an IP camera.
#   pattern_video  the same picture without audio.
#   pattern_pcma   1280x720 H.264 + G.711 A-law 8 kHz (the other common camera audio codec).
#   pattern_h265   the picture in H.265 (no audio): the only video WebRTC decodes in the emulator.

logLevel: info
logDestinations: [stdout]

# Only RTSP over TCP; everything else off.
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtspEncryption: "no"
rtmp: no
hls: no
webrtc: no
srt: no
moq: no
api: no
metrics: no
pprof: no
playback: no

# Publishing only from inside the container (the ffmpeg commands below);
# reading from anyone who can reach the port.
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1/32", "::1/128"]
    permissions:
      - action: publish
      - action: read
  - user: any
    pass:
    ips: []
    permissions:
      - action: read

pathDefaults:
  runOnDemandRestart: yes
  runOnDemandStartTimeout: 15s
  runOnDemandCloseAfter: 10s

paths:
  pattern:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=15
      -f lavfi -i sine=frequency=440:beep_factor=4:sample_rate=16000
      -c:v libx264 -preset ultrafast -tune zerolatency -x264-params sliced-threads=0 -profile:v baseline -pix_fmt yuv420p -g 30
      -c:a aac -b:a 32k -ac 1
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
  # H.265 for WebRTC in the emulator (10-11-2026): the WebView decodes it in software when the
  # emulator's hardware decoder is off (EMULATOR_HW_DECODER=off); its H.264 decoding fails there.
  pattern_h265:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=15
      -c:v libx265 -preset ultrafast -tune zerolatency -x265-params keyint=30:repeat-headers=1 -pix_fmt yuv420p
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
  pattern_video:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=15
      -c:v libx264 -preset ultrafast -tune zerolatency -x264-params sliced-threads=0 -profile:v baseline -pix_fmt yuv420p -g 30
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
  pattern_pcma:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=15
      -f lavfi -i sine=frequency=440:beep_factor=4:sample_rate=8000
      -c:v libx264 -preset ultrafast -tune zerolatency -x264-params sliced-threads=0 -profile:v baseline -pix_fmt yuv420p -g 30
      -c:a pcm_alaw -ar 8000 -ac 1
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH

  # Opt-in audio scenes (video/audio/README.md): synthetic, generated by ffmpeg, no recordings.
  # baby: grey picture (like a monitor's night view) with a crying-like sound: bursts of a
  # wobbling ~430 Hz tone with harmonics, 1.1 s on and 0.5 s off. AAC 16 kHz mono.
  baby:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=15,hue=s=0
      -f lavfi -i aevalsrc='(0.45*sin(2*PI*(430+70*sin(2*PI*5.5*t))*t)+0.2*sin(4*PI*(430+70*sin(2*PI*5.5*t))*t)+0.08*sin(6*PI*(430+70*sin(2*PI*5.5*t))*t))*gt(mod(t\,1.6)\,0.15)*lt(mod(t\,1.6)\,1.25)*(0.6+0.4*sin(2*PI*0.8*t))':s=16000:c=mono
      -c:v libx264 -preset ultrafast -tune zerolatency -x264-params sliced-threads=0 -profile:v baseline -pix_fmt yuv420p -g 30
      -c:a aac -b:a 32k -ac 1
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
  # doorbell: a 4:3 picture with an 8 s cycle: a two-tone chime (0-2.2 s), then speech-like
  # band-passed noise in syllable bursts (2.5-6.5 s), then quiet. G.711 A-law 8 kHz, as many
  # doorbells send.
  doorbell:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=960x720:rate=15
      -f lavfi -i aevalsrc='0.5*sin(2*PI*659*t)*exp(-2.5*mod(t\,8))*lt(mod(t\,8)\,1.2)+0.5*sin(2*PI*523*t)*exp(-2.5*(mod(t\,8)-0.7))*gte(mod(t\,8)\,0.7)*lt(mod(t\,8)\,2.2)':s=8000:c=mono
      -f lavfi -i anoisesrc=c=white:a=0.6:r=8000
      -filter_complex "[2]bandpass=f=900:w=1200,volume=12,volume='(0.2+0.8*gt(sin(2*PI*3.7*t)\,0))*gte(mod(t\,8)\,2.5)*lt(mod(t\,8)\,6.5)':eval=frame[s];[1][s]amix=inputs=2:normalize=0,alimiter=limit=0.9[a]"
      -map 0:v -map "[a]"
      -c:v libx264 -preset ultrafast -tune zerolatency -x264-params sliced-threads=0 -profile:v baseline -pix_fmt yuv420p -g 30
      -c:a pcm_alaw -ar 8000 -ac 1
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH

  # sync: for delay measurements (video/tools/av-delay.py). Every 30th frame is white below the
  # code band, and the audio has a 20 ms click at the same moment; both run on ffmpeg's own timeline
  # (frame number and sample time from one start, paced by -re), so they leave the source together.
  # The click's pitch tells the second apart: 700, 900, 1100 or 1300 Hz for second 0-3 (mod 4),
  # shown also as two grey/white blocks at the right of the band. The 16 black/white blocks on the
  # left carry the wall-clock time each frame passed the filters (frames of 1/30 s since 1970,
  # modulo 65536); on a white frame that is the send time of its click. No font needed. 30 fps
  # H.264 (one slice per frame), G.711 A-law 8 kHz (no codec delay).
  sync:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=30,hue=s=0
      -f lavfi -i aevalsrc='0.5*sin(2*PI*(700+200*mod(floor(t)\,4))*t)*lt(mod(t\,1)\,0.02)':s=8000:c=mono
      -filter_complex '[0:v]setpts=RTCTIME/1000000/TB,drawbox=x=0:y=0:w=64:h=60:color=black:t=fill,drawbox=x=6:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/1)\,2)\,1),drawbox=x=64:y=0:w=64:h=60:color=black:t=fill,drawbox=x=70:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/2)\,2)\,1),drawbox=x=128:y=0:w=64:h=60:color=black:t=fill,drawbox=x=134:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/4)\,2)\,1),drawbox=x=192:y=0:w=64:h=60:color=black:t=fill,drawbox=x=198:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/8)\,2)\,1),drawbox=x=256:y=0:w=64:h=60:color=black:t=fill,drawbox=x=262:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/16)\,2)\,1),drawbox=x=320:y=0:w=64:h=60:color=black:t=fill,drawbox=x=326:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/32)\,2)\,1),drawbox=x=384:y=0:w=64:h=60:color=black:t=fill,drawbox=x=390:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/64)\,2)\,1),drawbox=x=448:y=0:w=64:h=60:color=black:t=fill,drawbox=x=454:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/128)\,2)\,1),drawbox=x=512:y=0:w=64:h=60:color=black:t=fill,drawbox=x=518:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/256)\,2)\,1),drawbox=x=576:y=0:w=64:h=60:color=black:t=fill,drawbox=x=582:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/512)\,2)\,1),drawbox=x=640:y=0:w=64:h=60:color=black:t=fill,drawbox=x=646:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/1024)\,2)\,1),drawbox=x=704:y=0:w=64:h=60:color=black:t=fill,drawbox=x=710:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/2048)\,2)\,1),drawbox=x=768:y=0:w=64:h=60:color=black:t=fill,drawbox=x=774:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/4096)\,2)\,1),drawbox=x=832:y=0:w=64:h=60:color=black:t=fill,drawbox=x=838:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/8192)\,2)\,1),drawbox=x=896:y=0:w=64:h=60:color=black:t=fill,drawbox=x=902:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/16384)\,2)\,1),drawbox=x=960:y=0:w=64:h=60:color=black:t=fill,drawbox=x=966:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/32768)\,2)\,1),drawbox=x=1024:y=0:w=128:h=60:color=gray:t=fill,drawbox=x=1034:y=8:w=108:h=44:color=white:t=fill:enable=eq(mod(floor(mod(floor(n/30)\,4)/1)\,2)\,1),drawbox=x=1152:y=0:w=128:h=60:color=gray:t=fill,drawbox=x=1162:y=8:w=108:h=44:color=white:t=fill:enable=eq(mod(floor(mod(floor(n/30)\,4)/2)\,2)\,1),drawbox=x=0:y=60:w=iw:h=ih-60:color=white:t=fill:enable=lt(mod(n\,30)\,1),setpts=N/30/TB[v]'
      -map [v] -map 1:a
      -c:v libx264 -preset ultrafast -tune zerolatency -x264-params sliced-threads=0 -profile:v baseline -pix_fmt yuv420p -g 30
      -c:a pcm_alaw -ar 8000 -ac 1
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
  # sync15: the same at 15 fps, for WebRTC in the emulator (its software H.264 decoder keeps up with
  # 15 fps at 1280x720, not with 30: 13 of 30 decoded, measured 10-11-2026). Frame numbers count 15 a second.
  sync15:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=15,hue=s=0
      -f lavfi -i aevalsrc='0.5*sin(2*PI*(700+200*mod(floor(t)\,4))*t)*lt(mod(t\,1)\,0.02)':s=8000:c=mono
      -filter_complex '[0:v]setpts=RTCTIME/1000000/TB,drawbox=x=0:y=0:w=64:h=60:color=black:t=fill,drawbox=x=6:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/1)\,2)\,1),drawbox=x=64:y=0:w=64:h=60:color=black:t=fill,drawbox=x=70:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/2)\,2)\,1),drawbox=x=128:y=0:w=64:h=60:color=black:t=fill,drawbox=x=134:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/4)\,2)\,1),drawbox=x=192:y=0:w=64:h=60:color=black:t=fill,drawbox=x=198:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/8)\,2)\,1),drawbox=x=256:y=0:w=64:h=60:color=black:t=fill,drawbox=x=262:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/16)\,2)\,1),drawbox=x=320:y=0:w=64:h=60:color=black:t=fill,drawbox=x=326:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/32)\,2)\,1),drawbox=x=384:y=0:w=64:h=60:color=black:t=fill,drawbox=x=390:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/64)\,2)\,1),drawbox=x=448:y=0:w=64:h=60:color=black:t=fill,drawbox=x=454:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/128)\,2)\,1),drawbox=x=512:y=0:w=64:h=60:color=black:t=fill,drawbox=x=518:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/256)\,2)\,1),drawbox=x=576:y=0:w=64:h=60:color=black:t=fill,drawbox=x=582:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/512)\,2)\,1),drawbox=x=640:y=0:w=64:h=60:color=black:t=fill,drawbox=x=646:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/1024)\,2)\,1),drawbox=x=704:y=0:w=64:h=60:color=black:t=fill,drawbox=x=710:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/2048)\,2)\,1),drawbox=x=768:y=0:w=64:h=60:color=black:t=fill,drawbox=x=774:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/4096)\,2)\,1),drawbox=x=832:y=0:w=64:h=60:color=black:t=fill,drawbox=x=838:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/8192)\,2)\,1),drawbox=x=896:y=0:w=64:h=60:color=black:t=fill,drawbox=x=902:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/16384)\,2)\,1),drawbox=x=960:y=0:w=64:h=60:color=black:t=fill,drawbox=x=966:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*15+0.5)/32768)\,2)\,1),drawbox=x=1024:y=0:w=128:h=60:color=gray:t=fill,drawbox=x=1034:y=8:w=108:h=44:color=white:t=fill:enable=eq(mod(floor(mod(floor(n/15)\,4)/1)\,2)\,1),drawbox=x=1152:y=0:w=128:h=60:color=gray:t=fill,drawbox=x=1162:y=8:w=108:h=44:color=white:t=fill:enable=eq(mod(floor(mod(floor(n/15)\,4)/2)\,2)\,1),drawbox=x=0:y=60:w=iw:h=ih-60:color=white:t=fill:enable=lt(mod(n\,15)\,1),setpts=N/15/TB[v]'
      -map [v] -map 1:a
      -c:v libx264 -preset ultrafast -tune zerolatency -x264-params sliced-threads=0 -profile:v baseline -pix_fmt yuv420p -g 15
      -c:a pcm_alaw -ar 8000 -ac 1
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
  # sync_aac: the same as sync, with AAC 48 kHz audio instead of G.711, for players that drop G.711
  # (Home Assistant's HLS does). AAC adds its encoder delay (1024 samples priming, about 21 ms) to the
  # audio: subtract it from A/V offsets measured on this path.
  sync_aac:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=30,hue=s=0
      -f lavfi -i aevalsrc='0.5*sin(2*PI*(700+200*mod(floor(t)\,4))*t)*lt(mod(t\,1)\,0.02)':s=48000:c=mono
      -filter_complex '[0:v]setpts=RTCTIME/1000000/TB,drawbox=x=0:y=0:w=64:h=60:color=black:t=fill,drawbox=x=6:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/1)\,2)\,1),drawbox=x=64:y=0:w=64:h=60:color=black:t=fill,drawbox=x=70:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/2)\,2)\,1),drawbox=x=128:y=0:w=64:h=60:color=black:t=fill,drawbox=x=134:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/4)\,2)\,1),drawbox=x=192:y=0:w=64:h=60:color=black:t=fill,drawbox=x=198:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/8)\,2)\,1),drawbox=x=256:y=0:w=64:h=60:color=black:t=fill,drawbox=x=262:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/16)\,2)\,1),drawbox=x=320:y=0:w=64:h=60:color=black:t=fill,drawbox=x=326:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/32)\,2)\,1),drawbox=x=384:y=0:w=64:h=60:color=black:t=fill,drawbox=x=390:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/64)\,2)\,1),drawbox=x=448:y=0:w=64:h=60:color=black:t=fill,drawbox=x=454:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/128)\,2)\,1),drawbox=x=512:y=0:w=64:h=60:color=black:t=fill,drawbox=x=518:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/256)\,2)\,1),drawbox=x=576:y=0:w=64:h=60:color=black:t=fill,drawbox=x=582:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/512)\,2)\,1),drawbox=x=640:y=0:w=64:h=60:color=black:t=fill,drawbox=x=646:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/1024)\,2)\,1),drawbox=x=704:y=0:w=64:h=60:color=black:t=fill,drawbox=x=710:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/2048)\,2)\,1),drawbox=x=768:y=0:w=64:h=60:color=black:t=fill,drawbox=x=774:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/4096)\,2)\,1),drawbox=x=832:y=0:w=64:h=60:color=black:t=fill,drawbox=x=838:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/8192)\,2)\,1),drawbox=x=896:y=0:w=64:h=60:color=black:t=fill,drawbox=x=902:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/16384)\,2)\,1),drawbox=x=960:y=0:w=64:h=60:color=black:t=fill,drawbox=x=966:y=8:w=52:h=44:color=white:t=fill:enable=eq(mod(floor(floor(t*30+0.5)/32768)\,2)\,1),drawbox=x=1024:y=0:w=128:h=60:color=gray:t=fill,drawbox=x=1034:y=8:w=108:h=44:color=white:t=fill:enable=eq(mod(floor(mod(floor(n/30)\,4)/1)\,2)\,1),drawbox=x=1152:y=0:w=128:h=60:color=gray:t=fill,drawbox=x=1162:y=8:w=108:h=44:color=white:t=fill:enable=eq(mod(floor(mod(floor(n/30)\,4)/2)\,2)\,1),drawbox=x=0:y=60:w=iw:h=ih-60:color=white:t=fill:enable=lt(mod(n\,30)\,1),setpts=N/30/TB[v]'
      -map [v] -map 1:a
      -c:v libx264 -preset ultrafast -tune zerolatency -x264-params sliced-threads=0 -profile:v baseline -pix_fmt yuv420p -g 30
      -c:a aac -ar 48000 -b:a 64k -ac 1
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
